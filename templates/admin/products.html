{% extends "base.html" %}
{% block body %}
<div class="app-layout">
  {% include 'admin/_sidebar.html' %}
  <main class="content">
    <h1>Menü Düzenle</h1>

    <div class="card">
      <h3>Yeni Ürün</h3>
      <form method="POST" enctype="multipart/form-data" class="form-grid">
        <select name="category_id" required>
          <option value="">Kategori seçin</option>
          {% for c in categories %}<option value="{{ c.id }}">{{ c.name_tr }}</option>{% endfor %}
        </select>
        <input type="text" name="name_tr" placeholder="Ürün adı (TR)" required>
        <input type="text" name="name_en" placeholder="Product name (EN)">
        <input type="number" step="0.01" name="price" placeholder="Fiyat ₺" required>
        <textarea name="description_tr" placeholder="Açıklama TR"></textarea>
        <textarea name="description_en" placeholder="Description EN"></textarea>
        <input type="file" name="image" accept="image/*">
        <button class="btn-primary">Ürün Ekle</button>
      </form>
    </div>

    <div class="product-grid">
      {% for p in products %}
        <div class="product-card">
          {% if p.image %}<img src="{{ url_for('static', filename='uploads/' ~ p.image) }}">{% endif %}
          <h4>{{ p.name_tr }}</h4>
          <p class="muted">{{ p.description_tr }}</p>
          <p class="price">{{ "%.2f"|format(p.price) }} ₺</p>
          <form method="POST" action="{{ url_for('admin.delete_product', pid=p.id) }}" onsubmit="return confirm('Silinsin mi?')">
            <button class="btn-danger btn-mini">Sil</button>
          </form>
        </div>
      {% endfor %}
    </div>
  </main>
</div>
{% endblock %}
