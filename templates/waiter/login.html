{% extends "base.html" %}
{% block body %}
<div class="setup-container">
  <div class="card">
    <h1>Garson Girişi</h1>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="alert {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <label>İsim</label>
      <input type="text" name="name" required>
      <label>Şifre</label>
      <input type="password" name="password" required>
      <button class="btn-primary">Giriş</button>
    </form>
    <a href="{{ url_for('admin.login') }}" class="link">Yönetici girişi →</a>
  </div>
</div>
{% endblock %}
