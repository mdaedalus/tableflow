{% extends "base.html" %}
{% block body %}
<div class="setup-container">
  <div class="card">
    <h1>Kaç Masanız Var?</h1>
    <p class="muted">Adım 2 / 3 — Masa sayısını girin</p>
    <form method="POST">
      <label>Masa Sayısı</label>
      <input type="number" name="table_count" min="1" max="200" required placeholder="Örn: 12">
      <button type="submit" class="btn-primary">Devam Et →</button>
    </form>
  </div>
</div>
{% endblock %}
