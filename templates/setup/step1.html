{% extends "base.html" %}
{% block body %}
<div class="setup-container">
  <div class="card">
    <h1>Restoran Kurulumu</h1>
    <p class="muted">Adım 1 / 3 — Restoran bilgileri</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="alert {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <label>Restoran Adı</label>
      <input type="text" name="name" required placeholder="Örn: Lezzet Durağı">

      <label>Yönetici Şifresi</label>
      <input type="password" name="password" required placeholder="Güçlü bir şifre">

      <label>Dil</label>
      <select name="language">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
      </select>

      <button type="submit" class="btn-primary">Devam Et →</button>
    </form>
  </div>
</div>
{% endblock %}
